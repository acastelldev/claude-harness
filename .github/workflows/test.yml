name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: example projects pass their own checks
        shell: bash
        run: |
          (cd examples/tienda-node && npm test)
          (cd examples/notas-python && python -m unittest || python3 -m unittest)

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/harness
